name: TaskFlow CI

on:
  push:
    branches: [ main1, develop1 ]
  pull_request:
    branches: [ main1, develop1 ]

jobs:
  backend-tests:
    name: Backend Tests (Laravel Pest)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: taskflow_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, redis
          coverage: none

      - name: Install Dependencies
        run: |
          cd apps/api
          composer install --prefer-dist --no-progress --no-interaction

      - name: Copy .env.testing
        run: |
          cd apps/api
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Run Pest Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taskflow_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          cd apps/api
          php artisan migrate --env=testing
          ./vendor/bin/pest

  frontend-checks:
    name: Frontend Lint & Build (Vue 3)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run Vue Type Check & Build
        run: |
          cd apps/web
          npm run build