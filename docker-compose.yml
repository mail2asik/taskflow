services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: taskflow-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - taskflow-network

  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - taskflow-network

  mysql:
    image: mysql:8.0
    container_name: taskflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - taskflow-network

  redis:
    image: redis:alpine
    container_name: taskflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - taskflow-network

networks:
  taskflow-network:
    driver: bridge

volumes:
  dbdata:
    driver: local