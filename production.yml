services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: taskflow-api
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .production.env
      - .production.local.env
    volumes:
      - ./apps/api:/var/www
    networks:
      - shared-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api-taskflow.asik.work
    container_name: taskflow-web
    restart: unless-stopped
    volumes:
      - ./apps/web:/var/www
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - shared-network

networks:
  shared-network:
    external: true