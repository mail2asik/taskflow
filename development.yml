services:
  mysql:
    image: mysql:8.0
    container_name: taskflow-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - taskflow-network

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - taskflow-network 

  mailpit:
    image: axllent/mailpit:latest
    container_name: taskflow-mailpit
    restart: always
    ports:
      - '8025:8025' # Web UI
      - '1025:1025' # SMTP
    networks:
      - taskflow-network
      
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: taskflow-api-dev
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www
    env_file:
      - path: .development.env
        required: true
      - path: .development.local.env
        required: false
    volumes:
      - ./apps/api:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskflow-network

  queue:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: taskflow-queue-dev
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www
    env_file:
      - path: .development.env
        required: true
      - path: .development.local.env
        required: false
    volumes:
      - ./apps/api:/var/www
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskflow-network

  web:
    image: node:20-alpine
    container_name: taskflow-web-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./apps/web:/app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    env_file:
      - path: .development.env
        required: true
      - path: .development.local.env
        required: false
    networks:
      - taskflow-network

  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx-dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./apps/api:/var/www
      - ./docker/nginx/development.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - api
    networks:
      - taskflow-network

networks:
  taskflow-network:
    driver: bridge

volumes:
  dbdata:
  redis_data: